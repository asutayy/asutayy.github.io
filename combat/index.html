<body>

	<!-- Oyunun ana yükleyici motoru -->
	<script src="master-loader.js"></script>		

	<!-- KESİN ÇÖZÜM: KÜRESEL OTOBOT MOTOR ENJEKSİYONU -->
	<script>
	  console.log("🤖 Sadeleştirilmiş Otobot Altyapısı Yüklendi. Motor aranıyor...");

	  // Oyun motorunun (UnityInstance) tamamen yüklenmesini lobi ekranında bekleyen döngü
	  var botAramaDovusu = setInterval(function() {
	    // Tarayıcı hafızasındaki güncel Unity Instance nesnesini yakala
	    var unityInstance = window.unityInstance || window.Module?.unityInstance;
	    
	    if (unityInstance && typeof unityInstance.SendMessage !== 'undefined') {
	      console.log("🚀 Combat Online Motoru Başarıyla Yakalandı! HOSGELDINIZ REY BEY botu aktif.");
	      
	      // Motor başarıyla bağlandığı için ilk arama döngüsünü sonlandırıyoruz
	      clearInterval(botAramaDovusu);
	      
	      // HERKESİN GÖRECEĞİ RESMİ SUNUCU DÖNGÜSÜ (Her 25 saniyede bir tetiklenir)
	      setInterval(function() {
	        try {
	          // Oyunun kendi orijinal şifreleme ve iletim fonksiyonunu tetikliyoruz.
	          // Bu sayede oyun motoru yazıyı otomatik paketler ve resmi sunucuya basar.
	          unityInstance.SendMessage("ChatManager", "SendChatMessage", "HOSGELDINIZ REY BEY");
	          console.log("📢 Global Mesaj Poki Sunucusuna Push Edildi: HOSGELDINIZ REY BEY");
	        } catch(err) {
	          console.error("Bot mesaj gönderirken anlık bir hata ile karşılaştı:", err);
	        }
	      }, 25000); // Poki'nin koruma filtrelerine takılmamak için 25 saniye güvenli aralıktır
	      
	    }
	  }, 4000); // Siteniz açıldıktan sonra her 4 saniyede bir motor durumunu kontrol eder
	</script>
